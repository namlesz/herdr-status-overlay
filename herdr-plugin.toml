id = "local.status-overlay"
name = "Status Overlay"
version = "1.0.0"
min_herdr_version = "0.9.5"
description = "Native macOS panel with agent statuses read from the Herdr API."
platforms = ["macos"]

# Start without a terminal after the server restores its session.
[[startup]]
command = ["bin/open-overlay"]

# The action starts the background helper and returns.
[[actions]]
id = "open"
title = "Status overlay: start"
contexts = ["workspace"]
command = ["bin/open-overlay"]
